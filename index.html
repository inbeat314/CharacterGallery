<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-18 Manga Research Gallery</title>
  <style>
    /* サイト共通カラーパレット（変数） */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #ec4899;
      --border-color: #334155;
      --badge-bg: #334155;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    #main-content {
      padding: 15px;
    }
    .header-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title {
      font-size: 1.2rem;
      font-weight: bold;
    }
    /* ソート用ドロップダウンのスタイル */
    .sort-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .sort-select {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      outline: none;
      cursor: pointer;
    }
    #debug-msg {
      background: #334155;
      color: #fbbf24;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px; }
    .card-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
    .card-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 4px; }
    .card-sub-meta { font-size: 0.7rem; color: var(--text-sub); border-top: 1px solid var(--border-color); padding-top: 4px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
    .rate-badge { color: var(--accent-color); font-weight: bold; }
    .date-badge { background-color: var(--badge-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- ギャラリー本体画面 -->
  <div id="main-content">
    <div class="header-area">
      <div class="header-title">キャラ研究ギャラリー</div>
      
      <!-- ソート用UI -->
      <div class="sort-container">
        <label for="sort-select">並び替え:</label>
        <select id="sort-select" class="sort-select" onchange="sortAndRender()">
          <option value="default">スプレッドシート順</option>
          <option value="date-desc">登場時期（新しい順）</option>
          <option value="date-asc">登場時期（古い順）</option>
          <option value="rate-desc">R-18率（高い順）</option>
          <option value="total-desc">総投稿数（多い順）</option>
        </select>
      </div>
    </div>

    <div id="debug-msg">データを読み込み中...</div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <script>
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSd_7yNBPFl0D0UXvSbCCeUvU_9MJ4OoboLxkbsUVCxEpKe1wl1S6rrVHE5jMmujdQBu9j8KgmMlbUo/pub?output=csv"; // ★CSV URLを入力

    // 読み込んだ全カードデータを保持する配列
    let allCharacterData = [];

    document.addEventListener("DOMContentLoaded", () => {
      loadGalleryData();
    });

    async function loadGalleryData() {
      const debugDiv = document.getElementById('debug-msg');
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error(`HTTPエラー! ステータス: ${response.status}`);
        
        const csvText = await response.text();

        const rows = csvText.split(/\r?\n/).map(row => {
          return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
        }).filter(row => row.length > 1 && row.some(cell => cell !== ""));

        if (rows.length <= 1) {
          debugDiv.innerText = "⚠️ データが見つかりません。スプレッドシートの2行目以降にデータが入っているか確認してください。";
          return;
        }

        // CSVの各行をオブジェクト形式に変換して保管
        allCharacterData = [];
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          
          // %記号やカンマを除去して数値計算できるように加工
          const totalNum = parseInt(row[3] || "0", 10);
          const r18Num   = parseInt(row[4] || "0", 10);
          const rateNum  = parseFloat((row[5] || "0").replace('%', ''));

          allCharacterData.push({
            title:       row[0] || '無題',
            name:        row[1] || '未設定',
            imgUrl:      row[2] || '',
            total:       totalNum,
            r18:         r18Num,
            r18RateRaw:  rateNum,
            r18RateStr:  row[5] || '0%',
            releaseDate: row[6] || '時期不明'
          });
        }

        // 初回描画
        sortAndRender();

        debugDiv.style.display = 'none';
      } catch (err) {
        debugDiv.style.color = '#ef4444';
        debugDiv.innerText = "❌ エラーが発生しました:\n" + err.message;
      }
    }

    // 並び替え＆画面描画の処理
    function sortAndRender() {
      const sortValue = document.getElementById('sort-select').value;
      
      // 元データを壊さないようにコピーを作成してソート
      let sortedData = [...allCharacterData];

      if (sortValue === 'date-desc') {
        // 登場時期（新しい順）
        sortedData.sort((a, b) => b.releaseDate.localeCompare(a.releaseDate));
      } else if (sortValue === 'date-asc') {
        // 登場時期（古い順）
        sortedData.sort((a, b) => a.releaseDate.localeCompare(b.releaseDate));
      } else if (sortValue === 'rate-desc') {
        // R-18率（高い順）
        sortedData.sort((a, b) => b.r18RateRaw - a.r18RateRaw);
      } else if (sortValue === 'total-desc') {
        // 総投稿数（多い順）
        sortedData.sort((a, b) => b.total - a.total);
      }

      // カード描画
      const grid = document.getElementById('gallery-grid');
      grid.innerHTML = '';

      sortedData.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.imgUrl}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image';">
          <div class="card-body">
            <div class="card-title">${item.title}</div>
            <div class="card-name">${item.name}</div>
            <div class="card-meta">
              <span>R18: ${item.r18}/${item.total}</span>
              <span class="rate-badge">${item.r18RateStr}</span>
            </div>
            <div class="card-sub-meta">
              <span>登場時期</span>
              <span class="date-badge">${item.releaseDate}</span>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
