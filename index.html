<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-18 Manga Research Gallery</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #ec4899;
      --border-color: #334155;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    #auth-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }
    .auth-card {
      background-color: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
      width: 100%;
      max-width: 360px;
      text-align: center;
      border: 1px solid var(--border-color);
    }
    .auth-card h2 { margin-top: 0; font-size: 1.25rem; }
    .auth-input {
      width: 100%;
      padding: 12px;
      margin: 15px 0;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-color);
      color: #fff;
      font-size: 1rem;
      box-sizing: border-box;
      text-align: center;
    }
    .auth-btn {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: none;
      background-color: var(--accent-color);
      color: white;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
    }
    #main-content { display: none; padding: 15px; }
    .header-title { font-size: 1.2rem; margin-bottom: 15px; font-weight: bold; }
    #debug-msg {
      background: #334155;
      color: #fbbf24;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px; }
    .card-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
    .card-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; }
    .rate-badge { color: var(--accent-color); font-weight: bold; }
  </style>
</head>
<body>

  <!-- パスワード画面 -->
  <div id="auth-screen">
    <div class="auth-card">
      <h2>🔒 パスワードを入力</h2>
      <input type="password" id="pass-input" class="auth-input" placeholder="Password">
      <button onclick="checkAuth()" class="auth-btn">ログイン</button>
    </div>
  </div>

  <!-- ギャラリー本体画面 -->
  <div id="main-content">
    <div class="header-title">キャラ研究ギャラリー</div>
    <div id="debug-msg">データを読み込み中...</div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <script>
    // 設定項目
    const PASSWORD = "7522"; // ★希望のパスワードを設定してください
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSd_7yNBPFl0D0UXvSbCCeUvU_9MJ4OoboLxkbsUVCxEpKe1wl1S6rrVHE5jMmujdQBu9j8KgmMlbUo/pub?output=csv"; // ★CSV URLをここに貼る

    function checkAuth() {
      const input = document.getElementById('pass-input').value;
      if (input === PASSWORD) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-content').style.display = 'block';
        loadGalleryData();
      } else {
        alert('パスワードが正しくありません');
      }
    }

    async function loadGalleryData() {
      const debugDiv = document.getElementById('debug-msg');
      try {
        debugDiv.innerText = "CSVデータを取得中...\n" + SPREADSHEET_CSV_URL;
        
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) {
          throw new Error(`HTTPエラー! ステータス: ${response.status}`);
        }
        
        const csvText = await response.text();
        debugDiv.innerText = "データ取得成功！解析中...\n文字数: " + csvText.length;

        // 簡易CSVパース（改行コード対応）
        const rows = csvText.split(/\r?\n/).map(row => {
          // ダブルクォーテーション対応のカンマ分割
          return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
        }).filter(row => row.length > 1 && row.some(cell => cell !== ""));

        if (rows.length <= 1) {
          debugDiv.innerText = "⚠️ データが見つかりません。スプレッドシートの2行目以降にデータが入っているか確認してください。\n取得結果:\n" + csvText.substring(0, 100);
          return;
        }

        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';
        let count = 0;

        // 2行目（データ行）からループ処理
        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const title   = row[0] || '無題';
          const name    = row[1] || '未設定';
          const imgUrl  = row[2] || '';
          const total   = row[3] || '0';
          const r18     = row[4] || '0';
          const r18Rate = row[5] || '0%';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${imgUrl}" alt="${name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image';">
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-name">${name}</div>
              <div class="card-meta">
                <span>R18: ${r18}/${total}</span>
                <span class="rate-badge">${r18Rate}</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
          count++;
        }

        debugDiv.style.display = 'none'; // 正常終了したらデバッグ表示を隠す
      } catch (err) {
        debugDiv.style.color = '#ef4444';
        debugDiv.innerText = "❌ エラーが発生しました:\n" + err.message + "\n\nCSVのURLが正しいか、または『ウェブに公開』が有効か確認してください。";
      }
    }
  </script>
</body>
</html>
