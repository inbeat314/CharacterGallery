<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>R-18 Manga Research Gallery</title>
  <style>
    /* サイト共通カラーパレット（変数） */
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --text-sub: #94a3b8;
      --accent-color: #ec4899;
      --border-color: #334155;
      --badge-bg: #334155;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
    }
    #main-content {
      padding: 15px;
    }
    .header-title {
      font-size: 1.2rem;
      margin-bottom: 15px;
      font-weight: bold;
    }
    #debug-msg {
      background: #334155;
      color: #fbbf24;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      margin-bottom: 15px;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 12px;
    }
    .card {
      background-color: var(--card-bg);
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
    }
    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background-color: #000;
    }
    .card-body { padding: 10px; }
    .card-title { font-size: 0.75rem; color: var(--text-sub); margin-bottom: 2px; }
    .card-name { font-size: 0.9rem; font-weight: bold; margin-bottom: 6px; }
    .card-meta { font-size: 0.75rem; color: var(--text-sub); display: flex; justify-content: space-between; margin-bottom: 4px; }
    .card-sub-meta { font-size: 0.7rem; color: var(--text-sub); border-top: 1px solid var(--border-color); padding-top: 4px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; }
    .rate-badge { color: var(--accent-color); font-weight: bold; }
    .date-badge { background-color: var(--badge-bg); padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; color: #cbd5e1; }
  </style>
</head>
<body>

  <!-- ギャラリー本体画面 -->
  <div id="main-content">
    <div class="header-title">キャラ研究ギャラリー</div>
    <div id="debug-msg">データを読み込み中...</div>
    <div id="gallery-grid" class="gallery-grid"></div>
  </div>

  <script>
    const SPREADSHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1v.../pub?output=csv"; // ★CSV URLを入力

    // ページが開かれたら自動でデータ読み込みを実行
    document.addEventListener("DOMContentLoaded", () => {
      loadGalleryData();
    });

    async function loadGalleryData() {
      const debugDiv = document.getElementById('debug-msg');
      try {
        const response = await fetch(SPREADSHEET_CSV_URL);
        if (!response.ok) throw new Error(`HTTPエラー! ステータス: ${response.status}`);
        
        const csvText = await response.text();

        const rows = csvText.split(/\r?\n/).map(row => {
          return row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(cell => cell.replace(/^"|"$/g, '').trim());
        }).filter(row => row.length > 1 && row.some(cell => cell !== ""));

        if (rows.length <= 1) {
          debugDiv.innerText = "⚠️ データが見つかりません。スプレッドシートの2行目以降にデータが入っているか確認してください。";
          return;
        }

        const grid = document.getElementById('gallery-grid');
        grid.innerHTML = '';

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          const title       = row[0] || '無題';
          const name        = row[1] || '未設定';
          const imgUrl      = row[2] || '';
          const total       = row[3] || '0';
          const r18         = row[4] || '0';
          const r18Rate     = row[5] || '0%';
          const releaseDate = row[6] || '時期不明';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <img src="${imgUrl}" alt="${name}" onerror="this.src='https://via.placeholder.com/150?text=No+Image';">
            <div class="card-body">
              <div class="card-title">${title}</div>
              <div class="card-name">${name}</div>
              <div class="card-meta">
                <span>R18: ${r18}/${total}</span>
                <span class="rate-badge">${r18Rate}</span>
              </div>
              <div class="card-sub-meta">
                <span>登場時期</span>
                <span class="date-badge">${releaseDate}</span>
              </div>
            </div>
          `;
          grid.appendChild(card);
        }

        debugDiv.style.display = 'none';
      } catch (err) {
        debugDiv.style.color = '#ef4444';
        debugDiv.innerText = "❌ エラーが発生しました:\n" + err.message;
      }
    }
  </script>
</body>
</html>
